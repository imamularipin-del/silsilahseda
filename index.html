<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silsilah Keluarga</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1JorPSKbAIaA5K_tF2hsh-pD_8eL70rRa" />
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1JorPSKbAIaA5K_tF2hsh-pD_8eL70rRa" />
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2420;--mute:#6b766f;--line:#a9b8ad;--brand:#14532d;--L:#dbeafe;--P:#fce7f3;--bd:#e2e6e0}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--card:#1a211d;--ink:#e8eee9;--mute:#97a39b;--line:#3f5246;--brand:#4ade80;--L:#1e3a5f;--P:#5b2146;--bd:#2a342e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font:700 22px Fraunces,serif;margin:0;flex:1;min-width:150px}
h1 small{display:block;font:400 12px Inter;color:var(--mute)}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:none;color:var(--mute);padding:8px 14px;font:500 14px Inter;cursor:pointer}
.tabs button.on{background:var(--brand);color:var(--bg)}
.btn{border:0;background:var(--brand);color:var(--bg);padding:9px 16px;border-radius:10px;font:600 14px Inter;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:1px solid var(--bd)}
.btn.r{background:#b91c1c;color:#fff}
button:focus-visible,input:focus-visible,.c:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.scroll{overflow-x:auto;padding-bottom:16px}
.tree{display:inline-block;min-width:100%;text-align:center}
.tree ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;text-align:center;position:relative;padding:20px 6px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;border-top:2px solid var(--line);height:20px}
.tree li::before{left:0;width:var(--cx,50%)}
.tree li::after{left:var(--cx,50%);width:calc(100% - var(--cx,50%));border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree li.jog{padding-top:20px}
.tree li.jog::before{display:block;left:var(--a);width:var(--w);height:0;border:0;border-top:2px solid var(--line);border-radius:0}
.tree li.jog::after{display:block;left:var(--cx);width:0;height:20px;border:0;border-left:2px solid var(--line);border-radius:0}
.ord{list-style:none;margin:6px 0 14px;padding:0}.ord li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px;text-align:left;color:#222}.ord button{border:1px solid #ccc;background:#fff;color:#222;border-radius:6px;padding:4px 12px;cursor:pointer;margin-left:4px}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:20px}
.cp{display:inline-flex;align-items:center;gap:4px}
.h{position:relative;width:36px;height:18px;line-height:18px;text-align:center;color:#e11d48;font-size:13px}
.h::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--line)}
.h i{font-style:normal;position:relative;background:var(--bg);padding:0 3px}
.c{width:132px;min-height:100px;justify-content:center;background:var(--card);border:1px solid var(--bd);border-top:4px solid;border-radius:12px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.c.L{border-top-color:#3b82f6}.c.P{border-top-color:#ec4899}
.c .av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--L);display:grid;place-items:center;font-size:22px;margin-bottom:4px}
.c.P .av{background:var(--P)}
.c b{font:600 13px/1.25 Inter;word-break:break-word}
.c small{color:var(--mute);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-items:center}
.grid .c{width:100%}
input.q{width:100%;max-width:420px;margin-bottom:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font:inherit}
.empty{text-align:center;padding:60px 16px;color:var(--mute)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.f .w{grid-column:1/-1}
.f label{font-size:12px;color:var(--mute);display:block;margin-bottom:2px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:#111}
.chk{max-height:130px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;background:#fff}.chk label{display:flex;gap:8px;align-items:center;font-size:14px;color:#111;margin:0;padding:4px 0}.chk input{width:auto}
.fam{display:inline-flex;align-items:flex-start}
.wc{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 10px}
.wc::before,.wc::after{content:"";position:absolute;top:50px;width:50%;border-top:2px solid var(--line)}
.wc::before{left:0}.wc::after{left:50%}
.wc:first-child::before,.wc:last-child::after{display:none}
.wc>.c{position:relative;z-index:1}
.hh{position:absolute;left:0;top:41px;transform:translateX(-50%);z-index:2;background:var(--bg);color:#e11d48;font-size:13px;line-height:18px;padding:0 3px}
.cont{display:block;width:max-content;margin:6px auto 0;padding:2px 10px;border:1px dashed var(--line);border-radius:6px;font-size:11px;color:var(--mute)}
#print{display:none}
#print.prep{display:block;position:absolute;left:-99999px;top:0;width:var(--pw);--bg:#fff;--card:#fff;--ink:#111;--line:#777;--bd:#bbb;--L:#dbeafe;--P:#fce7f3;--mute:#555;--brand:#14532d;background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg .pgb{display:flex;justify-content:center}
.pg .tree{flex:none;width:max-content;min-width:0}
.pgh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid #14532d;padding-bottom:6px;margin-bottom:12px;font-size:13px}
.pgh b{font:700 18px Fraunces,serif}
@media print{
  body>*:not(#print){display:none!important}
  #print.prep{position:static!important;left:auto!important;width:auto!important}
  .pg{break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.swal2-popup{font-family:Inter,system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <h1>Silsilah Keluarga<small id="stat"></small></h1>
  <div class="tabs" role="tablist"><button id="t1" class="on" onclick="view('tree')">Pohon</button><button id="t2" onclick="view('list')">Daftar</button></div>
  <button class="btn o" onclick="printDlg()">Cetak</button>
  <button class="btn" onclick="openForm()">+ Anggota</button>
</header>
<main><div id="app"></div></main>

<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script>
/* ====== KONFIGURASI: tempel URL Web App Apps Script Anda ====== */
const API = 'https://script.google.com/macros/s/AKfycbzYbO8Hbif5p5BLdM1QliAwMtxxFPwpC0q-bVpPiniHNvi1qKfQFN8_eYjloLHWWcrS/exec';
/* ============================================================== */

let D = [], V = 'tree', KEY = '';
const $ = s => document.querySelector(s);
const by = id => D.find(p => p.id === id);
const split = s => String(s || '').split(',').filter(Boolean);
const headOf = comp => [...comp].sort((a, b) => spouses(b).length - spouses(a).length || (a.gender === 'L' ? -1 : 1) - (b.gender === 'L' ? -1 : 1))[0];
const ord = (a, b) => (parseInt(a.urutan) || 9999) - (parseInt(b.urutan) || 9999);
const spouses = p => { const ids = new Set(split(p.pasangan_id)); D.forEach(x => { if (split(x.pasangan_id).includes(p.id)) ids.add(x.id); }); return [...ids].map(by).filter(Boolean); };
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (icon, title) => Swal.fire({toast:true, position:'top-end', icon, title, showConfirmButton:false, timer:2600, timerProgressBar:true});
const busy = t => Swal.fire({title:t, allowOutsideClick:false, showConfirmButton:false, didOpen:() => Swal.showLoading()});

async function load(silent) {
  if (API.startsWith('GANTI')) return Swal.fire('Belum dikonfigurasi', 'Isi konstanta API di index.html dengan URL Web App Apps Script.', 'warning');
  if (!silent) busy('Memuat data…');
  try {
    const r = await (await fetch(API)).json();
    D = r.data || [];
    render();
    if (!silent) Swal.close();
  } catch (e) {
    Swal.fire('Gagal memuat', 'Periksa koneksi atau URL Web App (akses harus "Siapa saja").', 'error');
  }
}

async function needKey() {
  if (KEY) return true;
  const { value } = await Swal.fire({title:'Kunci admin', text:'Masukkan kunci untuk mengubah data.', input:'password', showCancelButton:true, confirmButtonText:'Lanjut', cancelButtonText:'Batal'});
  if (!value) return false;
  KEY = value; return true;
}

async function api(action, person) {
  let txt;
  try {
    const qs = new URLSearchParams({action, key:KEY, p:JSON.stringify(person), _t:Date.now()});
    const res = await fetch(API + '?' + qs, {cache:'no-store'});
    txt = await res.text();
  } catch (e) {
    throw new Error('Server tidak dapat dihubungi. Periksa koneksi dan pastikan URL API adalah deployment terbaru (akses "Anyone").');
  }
  let r;
  try { r = JSON.parse(txt); }
  catch (e) { throw new Error('Respons server bukan JSON: ' + txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 180)); }
  if (!r.ok) { if (/Kunci/.test(r.msg)) KEY = ''; throw new Error(r.msg); }
  return r;
}

/* ---------- Tampilan ---------- */
function card(p, note) {
  const y = [p.lahir, p.wafat].filter(Boolean).join(' – ');
  const av = p.foto ? `<img class="av" src="${esc(p.foto)}" alt="" onerror="this.outerHTML='<div class=&quot;av&quot;>${p.gender === 'P' ? '♀' : '♂'}</div>'">` : `<div class="av">${p.gender === 'P' ? '♀' : '♂'}</div>`;
  return `<div class="c ${p.gender}" tabindex="0" role="button" onclick="detail('${p.id}')" onkeydown="if(event.key==='Enter')detail('${p.id}')">${av}<b>${esc(p.nama)}</b><small>${esc(y)}</small>${note ? `<small><i>${esc(note)}</i></small>` : ''}</div>`;
}

function unit(p) {  // semua pasangan yang saling terhubung (suami + beberapa istri)
  const seen = new Set([p.id]), q = [p];
  for (let i = 0; i < q.length; i++) for (const s of spouses(q[i])) if (!seen.has(s.id)) { seen.add(s.id); q.push(s); }
  return q;
}

function node(p, seen, o) {   // o (opsional): batas generasi untuk cetak {d, max, cur, pages}
  const comp = unit(p);
  const head = headOf(comp);
  const sp = spouses(head);
  const others = [...sp, ...comp.filter(x => x !== head && !sp.includes(x))];
  comp.forEach(x => seen.add(x.id));
  const ids = comp.map(x => x.id);
  let cutNo = 0;
  const cutTag = () => { if (!cutNo) { o.pages.push({root: p.id, from: o.cur}); cutNo = o.pages.length; } return `<div class="cont">↳ lanjut hlm. ${cutNo}</div>`; };
  const ul = ks => !ks.length ? '' : (o && o.d >= o.max) ? cutTag() : '<ul>' + ks.map(k => node(k, seen, o && {...o, d: o.d + 1})).join('') + '</ul>';

  // satu pasangan: pasangan berdampingan, anak di bawahnya
  if (others.length < 2) {
    const kids = D.filter(k => (ids.includes(k.ayah_id) || ids.includes(k.ibu_id)) && !seen.has(k.id)).sort(ord);
    return `<li><div class="cp">${[head, ...others].map((x, i) => (i ? '<span class="h"><i>♥</i></span>' : '') + card(x)).join('')}</div>${ul(kids)}</li>`;
  }

  // beberapa pasangan: suami di kiri, istri berurutan ke kanan, anak digantung di bawah ibunya masing-masing
  const col = (x, ks, first) => `<div class="wc${x === head ? ' head' : ''}">${first ? '' : '<span class="hh">♥</span>'}${card(x)}${ul(ks)}</div>`;
  const taken = new Set();   // setiap anak hanya muncul di satu kolom
  const kidsOf = w => { const r = D.filter(k => (k.ayah_id === w.id || k.ibu_id === w.id) && !seen.has(k.id) && !taken.has(k.id)).sort(ord); r.forEach(k => taken.add(k.id)); return r; };
  const rest = others.map(w => [w, kidsOf(w)]);
  const own = D.filter(k => (ids.includes(k.ayah_id) || ids.includes(k.ibu_id)) && !seen.has(k.id) && !taken.has(k.id)).sort(ord);
  const cols = [[head, own], ...rest];
  return `<li><div class="fam">${cols.map(([x, ks], i) => col(x, ks, i === 0)).join('')}</div></li>`;
}

function alignLines() {  // sambungkan garis induk tepat ke kartu kepala keluarga
  document.querySelectorAll('.tree li').forEach(li => {
    const hd = li.querySelector(':scope > .fam > .wc.head');
    if (!hd) return;
    const lr = li.getBoundingClientRect(), r = hd.getBoundingClientRect();
    const cx = r.left - lr.left + r.width / 2;
    li.style.setProperty('--cx', cx + 'px');
    const top = li.parentElement.parentElement.classList.contains('tree');
    if (!top && li.matches(':only-child') && Math.abs(cx - lr.width / 2) > 2) {
      const m = lr.width / 2;
      li.classList.add('jog');
      li.style.setProperty('--a', Math.min(cx, m) + 'px');
      li.style.setProperty('--w', Math.abs(cx - m) + 'px');
    }
  });
}
function render() {
  $('#stat').textContent = D.length + ' anggota';
  const app = $('#app');
  if (!D.length) { app.innerHTML = '<div class="empty"><p>Belum ada anggota keluarga.</p><button class="btn" onclick="openForm()">Tambah anggota pertama</button></div>'; return; }
  if (V === 'tree') {
    const seen = new Set();
    const roots = D.filter(p => !p.ayah_id && !p.ibu_id && !unit(p).some(x => x.ayah_id || x.ibu_id)).sort(ord);
    app.innerHTML = '<div class="scroll"><div class="tree"><ul>' + roots.map(r => seen.has(r.id) ? '' : node(r, seen)).join('') + '</ul></div></div>';
    alignLines();
  } else {
    app.innerHTML = '<input class="q" id="q" type="search" placeholder="Cari nama…" oninput="renderList()"><div class="grid" id="gl"></div>';
    renderList();
  }
}
function renderList() {
  const q = ($('#q').value || '').toLowerCase();
  const l = D.filter(p => p.nama.toLowerCase().includes(q)).sort((a, b) => a.nama.localeCompare(b.nama));
  $('#gl').innerHTML = l.length ? l.map(p => card(p)).join('') : '<div class="empty w">Tidak ada nama yang cocok.</div>';
}
function view(v) { V = v; $('#t1').classList.toggle('on', v === 'tree'); $('#t2').classList.toggle('on', v === 'list'); render(); }

/* ---------- Detail ---------- */
function detail(id) {
  const p = by(id), f = by(p.ayah_id), m = by(p.ibu_id), s = spouses(p);
  const anak = D.filter(k => k.ayah_id === id || k.ibu_id === id).sort(ord);
  const row = (a, b) => b ? `<p style="margin:4px 0"><span style="color:var(--mute)">${a}:</span> ${esc(b)}</p>` : '';
  Swal.fire({
    title: esc(p.nama), showConfirmButton: false, showCloseButton: true,
    html: `<div style="text-align:left">${row('Jenis kelamin', p.gender === 'P' ? 'Perempuan' : 'Laki-laki')}${row('Lahir', p.lahir)}${row('Wafat', p.wafat)}${row('Ayah', f && f.nama)}${row('Ibu', m && m.nama)}${row('Pasangan', s.map(x => x.nama).join(', '))}${row('Anak', anak.map(k => k.nama).join(', '))}${row('Catatan', p.catatan)}</div>
    <div class="acts"><button class="btn" onclick="Swal.close();edit('${id}')">Ubah</button><button class="btn o" onclick="Swal.close();addChild('${id}')">Tambah anak</button>${split(p.pasangan_id).length > 1 || anak.length > 1 ? `<button class="btn o" onclick="Swal.close();orderDlg('${id}')">Atur urutan</button>` : ''}<button class="btn r" onclick="Swal.close();del('${id}')">Hapus</button></div>`
  });
}
const edit = id => openForm(by(id));
async function addChild(id) {
  const p = by(id), sp = spouses(p);
  let s = sp[0];
  if (sp.length > 1) {
    const r = await Swal.fire({title:'Anak dari pasangan yang mana?', input:'select', inputOptions:Object.fromEntries(sp.map(x => [x.id, x.nama])), showCancelButton:true, confirmButtonText:'Lanjut', cancelButtonText:'Batal'});
    if (!r.isConfirmed) return;
    s = by(r.value);
  }
  const f = p.gender === 'L' ? p : s, m = p.gender === 'P' ? p : s;
  openForm({ayah_id: f ? f.id : '', ibu_id: m ? m.id : ''});
}

/* ---------- Cetak per cabang ---------- */
async function printDlg() {
  const hasKids = p => D.some(k => k.ayah_id === p.id || k.ibu_id === p.id);
  const roots = D.filter(p => !p.ayah_id && !p.ibu_id && hasKids(p));
  const cand = [...roots, ...D.filter(p => hasKids(p) && !roots.includes(p)).sort((a, b) => a.nama.localeCompare(b.nama))];
  if (!cand.length) return toast('info', 'Belum ada keturunan untuk dicetak');
  const sel = (id, arr) => `<select id="${id}">${arr.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
  const { value: v } = await Swal.fire({
    title: 'Cetak per cabang', width: 520, showCancelButton: true, confirmButtonText: 'Cetak / Simpan PDF', cancelButtonText: 'Batal', focusConfirm: false,
    html: `<div class="f"><div class="w"><label>Mulai dari leluhur</label>${sel('pr', cand.map(p => [p.id, esc(p.nama)]))}</div>
      <div><label>Generasi per halaman</label>${sel('pg', [[2,'2'],[3,'3'],[4,'4'],[5,'5'],[99,'Semua']])}</div>
      <div><label>Ukuran kertas</label>${sel('pp', [['A4','A4'],['A3','A3'],['A5','A5']])}</div>
      <div class="w"><label>Orientasi</label>${sel('po', [['L','Lanskap'],['P','Potret']])}</div></div>
      <p style="font-size:12px;color:#666;text-align:left">Cabang yang tidak muat diberi penanda "lanjut hlm. N" dan dilanjutkan di halaman berikutnya.</p>`,
    didOpen: () => { $('#pg').value = '3'; },
    preConfirm: () => ({root: $('#pr').value, max: +$('#pg').value, paper: $('#pp').value, orient: $('#po').value})
  });
  if (v) doPrint(v);
}

function doPrint({root, max, paper, orient}) {
  const PAPER = {A4: [297, 210], A3: [420, 297], A5: [210, 148]};
  let [w, h] = PAPER[paper]; if (orient === 'P') [w, h] = [h, w];
  const M = 10, mm = 3.7795;
  const availW = (w - 2 * M) * mm, availH = (h - 2 * M) * mm - 60;
  const pages = [{root, from: 0}], out = [];
  for (let i = 0; i < pages.length; i++) {
    const html = node(by(pages[i].root), new Set(), {d: 1, max, cur: i + 1, pages});
    out.push({...pages[i], html});
  }
  const pr = $('#print');
  pr.innerHTML = out.map((pg, i) => `<section class="pg"><div class="pgh"><b>Cabang keluarga ${esc(headOf(unit(by(pg.root))).nama)}</b><span>Halaman ${i + 1} / ${out.length}${pg.from ? ' · sambungan dari hlm. ' + pg.from : ''}</span></div><div class="pgb"><div class="tree"><ul>${pg.html}</ul></div></div></section>`).join('');
  pr.style.setProperty('--pw', availW + 'px');
  pr.classList.add('prep');
  let st = $('#pgst'); if (!st) { st = document.createElement('style'); st.id = 'pgst'; document.head.appendChild(st); }
  st.textContent = `@page{size:${paper} ${orient === 'P' ? 'portrait' : 'landscape'};margin:${M}mm}`;
  alignLines();                                   // ukur garis pada skala 1, baru perkecil
  pr.querySelectorAll('.tree').forEach(t => {
    const sc = Math.min(1, availW / t.offsetWidth, availH / t.offsetHeight);
    if (sc < 1) t.style.zoom = sc;
  });
  setTimeout(() => window.print(), 150);
}
window.addEventListener('afterprint', () => { const pr = $('#print'); pr.classList.remove('prep'); pr.innerHTML = ''; });

/* ---------- Atur urutan ---------- */
function mv(b, d) {
  const li = b.closest('li'), ul = li.parentNode;
  if (d < 0 && li.previousElementSibling) ul.insertBefore(li, li.previousElementSibling);
  else if (d > 0 && li.nextElementSibling) ul.insertBefore(li.nextElementSibling, li);
}
async function orderDlg(id) {
  const p = by(id);
  const sp = split(p.pasangan_id).map(by).filter(Boolean);
  const kd = D.filter(k => k.ayah_id === id || k.ibu_id === id).sort(ord);
  const list = (t, arr, cls) => arr.length < 2 ? '' : `<div style="text-align:left;font-weight:600;margin-top:6px">${t}</div><ul class="ord ${cls}">${arr.map(x => `<li data-id="${x.id}"><span>${esc(x.nama)}</span><span><button type="button" onclick="mv(this,-1)" aria-label="Naik">▲</button><button type="button" onclick="mv(this,1)" aria-label="Turun">▼</button></span></li>`).join('')}</ul>`;
  const r = await Swal.fire({title:'Atur urutan', html:list('Urutan pasangan (kiri ke kanan)', sp, 'sp') + list('Urutan anak (kiri ke kanan)', kd, 'kd'), showCancelButton:true, confirmButtonText:'Simpan urutan', cancelButtonText:'Batal'});
  if (!r.isConfirmed || !(await needKey())) return;
  const ids = c => [...document.querySelectorAll('.ord.' + c + ' li')].map(l => l.dataset.id);
  const items = [];
  busy('Menyimpan urutan…');
  const s = sp.length > 1 ? ids('sp') : [];
  if (s.length) items.push({id, pasangan_id: s.concat(split(p.pasangan_id).filter(x => !s.includes(x))).join(',')});
  (kd.length > 1 ? ids('kd') : []).forEach((kid, i) => items.push({id: kid, urutan: String(i + 1)}));
  try { await api('bulk', items); await load(true); Swal.close(); toast('success', 'Urutan berhasil disimpan'); }
  catch (e) { Swal.fire('Gagal menyimpan urutan', e.message, 'error'); }
}

/* ---------- Form ---------- */
const opt = (sel, list) => '<option value="">—</option>' + list.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.nama)}</option>`).join('');

async function openForm(p = {}) {
  const others = D.filter(x => x.id !== p.id);
  const { value: v } = await Swal.fire({
    title: p.id ? 'Ubah anggota' : 'Tambah anggota', width: 560, showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal', focusConfirm: false,
    html: `<div class="f">
      <div class="w"><label>Nama lengkap *</label><input id="n" value="${esc(p.nama)}"></div>
      <div><label>Jenis kelamin</label><select id="g"><option value="L" ${p.gender !== 'P' ? 'selected' : ''}>Laki-laki</option><option value="P" ${p.gender === 'P' ? 'selected' : ''}>Perempuan</option></select></div>
      <div><label>Foto (URL gambar)</label><input id="fo" value="${esc(p.foto)}" placeholder="https://…"></div>
      <div><label>Lahir</label><input id="l" value="${esc(p.lahir)}" placeholder="1950 atau 1950-05-17"></div>
      <div><label>Wafat</label><input id="w" value="${esc(p.wafat)}" placeholder="kosongkan jika hidup"></div>
      <div><label>Ayah</label><select id="a">${opt(p.ayah_id, others.filter(x => x.gender === 'L'))}</select></div>
      <div><label>Ibu</label><select id="i">${opt(p.ibu_id, others.filter(x => x.gender === 'P'))}</select></div>
      <div class="w"><label>Pasangan (boleh lebih dari satu)</label><div class="chk">${others.length ? others.map(x => `<label><input type="checkbox" class="sp" value="${x.id}" ${split(p.pasangan_id).includes(x.id) ? 'checked' : ''}> ${esc(x.nama)}</label>`).join('') : '<small>Belum ada anggota lain</small>'}</div></div>
      <div class="w"><label>Catatan</label><textarea id="c" rows="2">${esc(p.catatan)}</textarea></div></div>`,
    preConfirm: () => {
      const g = id => document.getElementById(id).value.trim();
      if (!g('n')) { Swal.showValidationMessage('Nama wajib diisi'); return false; }
      return {nama:g('n'), gender:g('g'), foto:g('fo'), lahir:g('l'), wafat:g('w'), ayah_id:g('a'), ibu_id:g('i'), pasangan_id:[...document.querySelectorAll('.sp:checked')].map(x => x.value).join(','), catatan:g('c')};
    }
  });
  if (!v) return;
  if (!(await needKey())) return;
  if (p.id) v.id = p.id;
  v.urutan = p.urutan || '';
  busy('Menyimpan…');
  try {
    const r = await api(p.id ? 'update' : 'add', v);
    const id = p.id || r.id;
    const nw = split(v.pasangan_id), od = split(p.pasangan_id);   // sinkronkan pasangan dua arah
    for (const sid of nw.filter(x => !od.includes(x))) {
      const s = by(sid); if (!s) continue;
      const l = split(s.pasangan_id);
      if (!l.includes(id)) { l.push(id); await api('update', {...s, pasangan_id: l.join(',')}); }
    }
    for (const sid of od.filter(x => !nw.includes(x))) {
      const s = by(sid); if (!s) continue;
      await api('update', {...s, pasangan_id: split(s.pasangan_id).filter(x => x !== id).join(',')});
    }
    await load(true);
    Swal.close(); toast('success', 'Data berhasil disimpan');
  } catch (e) { Swal.fire('Gagal menyimpan', e.message, 'error'); }
}

async function del(id) {
  const p = by(id);
  const ok = await Swal.fire({title:'Hapus anggota?', text:`"${p.nama}" akan dihapus permanen.`, icon:'warning', showCancelButton:true, confirmButtonColor:'#b91c1c', confirmButtonText:'Ya, hapus', cancelButtonText:'Batal'});
  if (!ok.isConfirmed || !(await needKey())) return;
  busy('Menghapus…');
  try { await api('delete', {id}); await load(true); Swal.close(); toast('success', 'Data berhasil dihapus'); }
  catch (e) { Swal.fire('Gagal menghapus', e.message, 'error'); }
}

load();
