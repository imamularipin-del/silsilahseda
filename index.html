<body>
<header>
  <h1>Silsilah Keluarga<small id="stat"></small></h1>
  <button class="btn o" id="sb" onclick="toggleSide()">☰ Daftar</button>
  <button class="btn o" onclick="printDlg()">Cetak</button>
  <button class="btn" onclick="openForm()">+ Anggota</button>
</header>
<main>
  <div id="app"></div>
  <aside id="side" aria-label="Daftar anggota">
    <div class="sh"><b>Daftar anggota</b><span id="sc"></span><button class="x" onclick="toggleSide()" aria-label="Tutup daftar">✕</button></div>
    <input class="q" id="q" type="search" placeholder="Cari nama…" oninput="renderList()">
    <div class="sl" id="gl"></div>
  </aside>
</main>

<div class="zc" id="zc" hidden>
  <button onclick="zoomBy(1.25)" aria-label="Perbesar">+</button>
  <button id="zl" onclick="setZ(1)" aria-label="Skala 100%">100%</button>
  <button onclick="zoomBy(0.8)" aria-label="Perkecil">−</button>
  <button onclick="fit()" aria-label="Muat seluruh pohon" title="Muat seluruh pohon">⤢</button>
</div>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script>
/* ====== KONFIGURASI: tempel URL Web App Apps Script Anda ====== */
const API = 'https://script.google.com/macros/s/AKfycbzYbO8Hbif5p5BLdM1QliAwMtxxFPwpC0q-bVpPiniHNvi1qKfQFN8_eYjloLHWWcrS/exec';
/* ============================================================== */

let D = [], V = 'tree', KEY = '';
const $ = s => document.querySelector(s);
const by = id => D.find(p => p.id === id);
const split = s => String(s || '').split(',').filter(Boolean);
const headOf = comp => [...comp].sort((a, b) => spouses(b).length - spouses(a).length || (a.gender === 'L' ? -1 : 1) - (b.gender === 'L' ? -1 : 1))[0];
const ord = (a, b) => (parseInt(a.urutan) || 9999) - (parseInt(b.urutan) || 9999);
const spouses = p => { const ids = new Set(split(p.pasangan_id)); D.forEach(x => { if (split(x.pasangan_id).includes(p.id)) ids.add(x.id); }); return [...ids].map(by).filter(Boolean); };
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (icon, title) => Swal.fire({toast:true, position:'top-end', icon, title, showConfirmButton:false, timer:2600, timerProgressBar:true});
const busy = t => Swal.fire({title:t, allowOutsideClick:false, showConfirmButton:false, didOpen:() => Swal.showLoading()});

async function load(silent) {
  if (API.startsWith('GANTI')) return Swal.fire('Belum dikonfigurasi', 'Isi konstanta API di index.html dengan URL Web App Apps Script.', 'warning');
  if (!silent) busy('Memuat data…');
  try {
    const r = await (await fetch(API)).json();
    D = r.data || [];
    render();
    if (!silent) Swal.close();
  } catch (e) {
    Swal.fire('Gagal memuat', 'Periksa koneksi atau URL Web App (akses harus "Siapa saja").', 'error');
  }
}

async function needKey() {
  if (KEY) return true;
  const { value } = await Swal.fire({title:'Kunci admin', text:'Masukkan kunci untuk mengubah data.', input:'password', showCancelButton:true, confirmButtonText:'Lanjut', cancelButtonText:'Batal'});
  if (!value) return false;
  KEY = value; return true;
}

async function api(action, person) {
  let txt;
  try {
    const qs = new URLSearchParams({action, key:KEY, p:JSON.stringify(person), _t:Date.now()});
    const res = await fetch(API + '?' + qs, {cache:'no-store'});
    txt = await res.text();
  } catch (e) {
    throw new Error('Server tidak dapat dihubungi. Periksa koneksi dan pastikan URL API adalah deployment terbaru (akses "Anyone").');
  }
  let r;
  try { r = JSON.parse(txt); }
  catch (e) { throw new Error('Respons server bukan JSON: ' + txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 180)); }
  if (!r.ok) { if (/Kunci/.test(r.msg)) KEY = ''; throw new Error(r.msg); }
  return r;
}

/* ---------- Tampilan ---------- */
function card(p, note, e, ref, ik) {
  const y = [p.lahir, p.wafat].filter(Boolean).join(' – ');
  const av = p.foto ? `<img class="av" src="${esc(p.foto)}" alt="" onerror="this.outerHTML='<div class=&quot;av&quot;>${p.gender === 'P' ? '♀' : '♂'}</div>'">` : `<div class="av">${p.gender === 'P' ? '♀' : '♂'}</div>`;
  return `<div class="c ${p.gender}${ref ? ' ref' : ''}" data-pid="${p.id}"${ik ? ' data-ik="' + ik + '"' : ''}${e ? ' data-e' : ''} tabindex="0" role="button" onclick="detail('${p.id}')" onkeydown="if(event.key==='Enter')detail('${p.id}')">${av}<b>${esc(p.nama)}</b><small>${esc(y)}</small>${note ? `<small><i>${esc(note)}</i></small>` : ''}</div>`;
}

const isRef = x => !!(x.ayah_id || x.ibu_id);   // punya orang tua tercatat: ia digambar di cabang orang tuanya
const refNote = x => { const f = by(x.ayah_id) || by(x.ibu_id); return f ? (x.gender === 'P' ? 'binti ' : 'bin ') + f.nama : ''; };
function unit(p) {  // p + pasangannya (suami dengan beberapa istri). Pasangan yang punya orang tua hanya dicantumkan, tidak ditelusuri
  const comp = [p], seen = new Set([p.id]);
  for (let i = 0; i < comp.length; i++) {
    if (i > 0 && isRef(comp[i])) continue;
    for (const s of spouses(comp[i])) if (!seen.has(s.id)) { seen.add(s.id); comp.push(s); }
  }
  return comp;
}

function node(p, seen, o, X) {   // o (opsional): batas generasi untuk cetak {d, max, cur, pages}
  const comp = unit(p);
  if (X && X.force) X.force.forEach(f => { if (!comp.includes(f)) comp.push(f); });
  const ab = (X && X.above) || '';
  const head = p;   // keturunan yang digambar; garis induk selalu masuk ke kartunya
  const sp = spouses(head);
  const others = [...sp, ...comp.filter(x => x !== head && !sp.includes(x))];
  const mineIds = comp.filter(x => x === p || !isRef(x) || (X && X.real && X.real.includes(x.id))).map(x => x.id);   // yang digambar di cabang ini
  mineIds.forEach(id => seen.add(id));                                        // pasangan referensi tidak ditandai
  const mine = k => mineIds.includes(k.ayah_id) || mineIds.includes(k.ibu_id);
  const homeOf = k => by(k.ayah_id) || by(k.ibu_id);                    // rumah anak: garis ayah (jika tak ada, ibu)
  const isHome = k => { const f = homeOf(k); return !!f && mineIds.includes(f.id); };
  const live = k => isHome(k) ? !seen.has(k.id) : true;                   // anak lintas-cabang selalu dicantumkan
  const refKid = k => `<li><div class="cp">${card(k, '↗ cabang ' + homeOf(k).nama, true, true)}</div></li>`;
  const cd = x => (x !== p && isRef(x) && !(X && X.real && X.real.includes(x.id))) ? card(x, refNote(x), false, true) : card(x, (x === head && X && X.note) || '', x === head);
  let cutNo = 0;
  const cutTag = () => { if (!cutNo) { o.pages.push({root: p.id, from: o.cur}); cutNo = o.pages.length; } return `<div class="cont">↳ lanjut hlm. ${cutNo}</div>`; };
  const ul = (ks, key) => (!ks.length || (X && X.nokids)) ? '' : (o && o.d >= o.max) ? cutTag() : (!o && COL.has(key)) ? '' : '<ul>' + ks.map(k => isHome(k) ? node(k, seen, o && {...o, d: o.d + 1}, X && X.target ? (k.id === X.target ? {} : {nokids: true}) : undefined) : refKid(k)).join('') + '</ul>';
  const tgl = (key, ks) => (o || (X && X.nokids) || !ks.length) ? '' : `<button class="tg" onclick="tog('${key}')" aria-label="${COL.has(key) ? 'Buka cabang' : 'Ciutkan cabang'}">${COL.has(key) ? '+' + (descN(ks.filter(isHome).map(k => k.id)) + ks.filter(k => !isHome(k)).length) : '−'}</button>`;

  // satu pasangan: pasangan berdampingan, anak di bawahnya
  if (others.length < 2) {
    const kids = D.filter(k => mine(k) && live(k)).sort(ord);
    const away = '';
    return `<li>${ab}<div class="cp${kids.length && !(X && X.nokids) ? ' hk' : ''}">${[head, ...others].map((x, i) => (i ? '<span class="h"><i>♥</i></span>' : '') + cd(x)).join('')}${tgl(head.id, kids)}</div>${ul(kids, head.id)}${away}</li>`;
  }

  // beberapa pasangan: suami di kiri, istri berurutan ke kanan, anak digantung di bawah ibunya masing-masing
  const col = (x, ks, first, away) => `<div class="wc${x === head ? ' head' : ''}">${first ? '' : '<span class="hh">♥</span>'}<div class="cw">${cd(x)}${tgl(x.id, ks)}</div>${ul(ks, x.id)}${away ? '<div class="cont">↳ anak ditampilkan di cabang pasangan</div>' : ''}</div>`;
  const taken = new Set();   // setiap anak hanya muncul di satu kolom
  const kidsOf = w => { const r = D.filter(k => (k.ayah_id === w.id || k.ibu_id === w.id) && mine(k) && live(k) && !taken.has(k.id)).sort(ord); r.forEach(k => taken.add(k.id)); return r; };
  const rest = others.map(w => [w, kidsOf(w), false]);
  const own = D.filter(k => mine(k) && live(k) && !taken.has(k.id)).sort(ord);
  const cols = [[head, own, false], ...rest];
  return `<li>${ab}<div class="fam">${cols.map(([x, ks, aw], i) => col(x, ks, i === 0, aw)).join('')}</div></li>`;
}

function alignLines() {  // garis induk selalu tersambung ke kartu keturunan; jarak garis seragam
  document.querySelectorAll('.tree li').forEach(li => {
    const e = li.querySelector(':scope > .cp > .c[data-e], :scope > .fam > .wc.head > .cw > .c[data-e]');
    if (!e) return;
    const lr = li.getBoundingClientRect(), r = e.getBoundingClientRect();
    const cx = r.left - lr.left + r.width / 2;
    li.style.setProperty('--cx', cx + 'px');
    const top = li.parentElement.parentElement.classList.contains('tree');
    if (!top && li.matches(':only-child')) {
      const m = lr.width / 2;
      li.classList.add('jog');
      li.style.setProperty('--a', Math.min(cx, m) + 'px');
      li.style.setProperty('--w', Math.abs(cx - m) + 'px');
    }
  });
}
let PED = '';     // id orang yang silsilahnya sedang ditampilkan
let FOCUS = '';   // id leluhur bila sedang melihat satu cabang
let Z = 0;   // skala pohon (0 = belum diatur)
let COL = new Set(); try { COL = new Set(JSON.parse(localStorage.getItem('col') || '[]')); } catch (e) {}
const saveCol = () => { try { localStorage.setItem('col', JSON.stringify([...COL])); } catch (e) {} };

function descN(ids) {   // jumlah keturunan (termasuk anak langsung)
  const seen = new Set(ids), q = [...ids];
  while (q.length) { const x = q.pop(); D.forEach(k => { if ((k.ayah_id === x || k.ibu_id === x) && !seen.has(k.id)) { seen.add(k.id); q.push(k.id); } }); }
  return seen.size;
}
function setFocus(id) { FOCUS = id; PED = ''; Z = 0; render(); }
function goto(id) {   // pindah ke kartu asli seseorang di pohon dan beri sorotan
  if (V !== 'tree') view('tree');
  const find = () => document.querySelector(`.tree .c[data-pid="${id}"]:not(.ref)`);
  let el = find();
  if (!el && (FOCUS || PED || COL.size)) { FOCUS = ''; PED = ''; COL.clear(); saveCol(); Z = 0; render(); el = find(); }
  if (!el) return toast('info', 'Tidak ditemukan di pohon');
  const sc = $('.scroll'), r = el.getBoundingClientRect(), s = sc.getBoundingClientRect();
  sc.scrollLeft += r.left - s.left - (sc.clientWidth - r.width) / 2;
  sc.scrollTop += r.top - s.top - (sc.clientHeight - r.height) / 2;
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2200);
}
function tog(key) { COL.has(key) ? COL.delete(key) : COL.add(key); saveCol(); render(); }
function colAll(on) {
  COL.clear();
  if (on) D.forEach(p => { if (D.some(k => k.ayah_id === p.id || k.ibu_id === p.id)) COL.add(p.id); });
  saveCol(); render();
}

function zl() { const e = $('#zl'); if (e) e.textContent = Math.round((Z || 1) * 100) + '%'; }
function sizeScroll() {
  const sd = $('#side'); if (sd && innerWidth >= 820) sd.style.height = Math.max(240, innerHeight - sd.getBoundingClientRect().top - 8) + 'px';
  const sc = $('.scroll'); if (!sc) return;
  sc.style.height = Math.max(240, innerHeight - sc.getBoundingClientRect().top - 8) + 'px';
}
function setZ(z, fx, fy) {   // ubah skala dengan titik fokus tetap
  const sc = $('.scroll'), t = $('.tree'); if (!sc || !t) return;
  z = Math.max(0.05, Math.min(2, z));
  const old = Z || 1;
  fx = fx == null ? sc.clientWidth / 2 : fx; fy = fy == null ? sc.clientHeight / 2 : fy;
  const cx = (sc.scrollLeft + fx) / old, cy = (sc.scrollTop + fy) / old;
  t.style.zoom = z; Z = z;
  sc.scrollLeft = cx * z - fx; sc.scrollTop = cy * z - fy;
  zl();
}
const zoomBy = f => setZ((Z || 1) * f);
function fit(initial) {   // initial: skala awal yang nyaman dibaca; tanpa argumen: muat seluruh pohon
  const sc = $('.scroll'), t = $('.tree'); if (!sc || !t) return;
  t.style.zoom = 1; Z = 1;
  const w = t.offsetWidth, hh = t.offsetHeight;
  let z = w > sc.clientWidth ? (sc.clientWidth - 8) / w : 1;
  if (initial) z = Math.max(z, 0.5); else z = Math.min(z, (sc.clientHeight - 8) / hh);
  t.style.zoom = Z = Math.max(0.05, Math.min(1, z));
  sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2; sc.scrollTop = 0;
  zl();
}
(function gestures() {   // cubit dua jari (HP) dan Ctrl+roda (komputer)
  const app = $('#app'); let pin = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  app.addEventListener('touchstart', e => { if (e.touches.length === 2 && e.target.closest('.scroll')) pin = {d: dist(e.touches), z: Z || 1}; }, {passive: true});
  app.addEventListener('touchmove', e => {
    if (!pin || e.touches.length !== 2) return;
    e.preventDefault();
    const r = $('.scroll').getBoundingClientRect();
    setZ(pin.z * dist(e.touches) / pin.d, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top);
  }, {passive: false});
  app.addEventListener('touchend', e => { if (e.touches.length < 2) pin = null; });
  app.addEventListener('wheel', e => {
    if (!e.ctrlKey || !e.target.closest('.scroll')) return;
    e.preventDefault();
    const r = $('.scroll').getBoundingClientRect();
    setZ((Z || 1) * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX - r.left, e.clientY - r.top);
  }, {passive: false});
  addEventListener('resize', sizeScroll);
})();

}

/* Silsilah per orang: leluhur ke atas (ayah + ibu, kakek-nenek, dst), saudara, pasangan, dan keturunan */
let PSIB = true;   // tampilkan saudara dari para leluhur
const sibSet = x => D.filter(k => (x.ayah_id && k.ayah_id === x.ayah_id) || (x.ibu_id && k.ibu_id === x.ibu_id)).sort(ord);   // x + semua saudaranya
const rel = (k, a) => { const x = parseInt(k.urutan), y = parseInt(a.urutan); return (x && y) ? (x < y ? 'kakak' : 'adik') : ''; };
function pedBody(id, seen) {
  const p = by(id), F = by(p.ayah_id), M = by(p.ibu_id), ik = {n: 0};
  const heart = '<span class="h"><i>♥</i></span>';
  const par = x => { const f = by(x.ayah_id), m = by(x.ibu_id); return (f || m) ? [f, m] : null; };
  // satu aturan untuk semua tingkat: kelompok saudara a (terurut, a di posisinya) + kelompok saudara b, orang tua mereka di atas
  const up = (a, b, to, depth) => {
    const mk = x => ({x, i: ++ik.n});
    const grp = (x, skip) => !x ? [] : ((PSIB && sibSet(x).some(k => k.id === x.id)) ? sibSet(x) : [x]).filter(k => k.id === x.id || !skip.includes(k.id)).map(mk);
    const GA = grp(a, b ? [b.id] : []), GB = grp(b, [...(a ? [a.id] : []), ...GA.map(o => o.x.id)]);
    const A = a && GA.find(o => o.x.id === a.id), B = b && GB.find(o => o.x.id === b.id);
    const pa = a && depth < 12 && par(a), pb = b && depth < 12 && par(b);
    const ua = pa ? up(pa[0], pa[1], GA.map(o => o.i).join(','), depth + 1) : '';
    const ub = pb ? up(pb[0], pb[1], GB.map(o => o.i).join(','), depth + 1) : '';
    const cards = (G, anc) => `<span class="grp">${G.map(o => card(o.x, o.x.id === anc.id ? '' : rel(o.x, anc), false, false, o.i)).join('')}</span>`;
    return `<div class="ac">${ua || ub ? `<div class="ar">${ua}${ub}</div>` : ''}<div class="cpl" data-up="${to}" data-a="${A ? A.i : ''}" data-b="${B ? B.i : ''}">${a ? cards(GA, a) : ''}${b ? cards(GB, b) : ''}</div></div>`;
  };
  const sibs = (F || M) ? sibSet(p) : [p];   // p + semua saudaranya (kakak dan adik, termasuk saudara tiri)
  const low = sibs.map(k => node(k, seen, undefined, k.id === id ? {} : {nokids: true, note: rel(k, p)})).join('');
  return {top: (F || M) ? up(F, M, 'low', 0) : '', low};
}
function drawPed() {   // garis leluhur: kurung pernikahan (♥) di bawah kartu, lalu siku membulat ke anak-anak (diukur pada skala 1)
  const t = $('.tree'), svg = t && t.querySelector('svg.pl'); if (!svg) return;
  const tr = t.getBoundingClientRect(), R = c => c.getBoundingClientRect(), X = v => v - tr.left, Y = v => v - tr.top;
  const elbow = (sx, sy, ex, ey, my) => {
    if (Math.abs(ex - sx) < 1) return `M${X(sx)} ${Y(sy)}V${Y(ey)}`;
    const dir = ex > sx ? 1 : -1, r = Math.max(0, Math.min(8, Math.abs(ex - sx) / 2, my - sy, ey - my));
    return `M${X(sx)} ${Y(sy)}V${Y(my) - r}Q${X(sx)} ${Y(my)} ${X(sx) + dir * r} ${Y(my)}H${X(ex) - dir * r}Q${X(ex)} ${Y(my)} ${X(ex)} ${Y(my) + r}V${Y(ey)}`;
  };
  let d = '', hearts = '';
  t.querySelectorAll('.cpl[data-up]').forEach(u => {
    const ub = Math.max(...[...u.querySelectorAll('.c')].map(c => R(c).bottom));
    const A = u.dataset.a && t.querySelector(`.c[data-ik="${u.dataset.a}"]`), B = u.dataset.b && t.querySelector(`.c[data-ik="${u.dataset.b}"]`);
    let sx, sy;
    if (A && B) {
      const ra = R(A), rb = R(B), ax = ra.left + ra.width / 2, bx = rb.left + rb.width / 2, y0 = ub + 14, dir = bx > ax ? 1 : -1, r = 8;
      d += `M${X(ax)} ${Y(ra.bottom)}V${Y(y0) - r}Q${X(ax)} ${Y(y0)} ${X(ax) + dir * r} ${Y(y0)}H${X(bx) - dir * r}Q${X(bx)} ${Y(y0)} ${X(bx)} ${Y(y0) - r}V${Y(rb.bottom)}`;
      sx = (ax + bx) / 2; sy = y0 + 9;
      hearts += `<circle class="hb" cx="${X(sx)}" cy="${Y(y0)}" r="9"/><text class="ht" x="${X(sx)}" y="${Y(y0)}" text-anchor="middle" dominant-baseline="central">♥</text>`;
    } else {
      const c = A || B; if (!c) return;
      const r = R(c); sx = r.left + r.width / 2; sy = r.bottom;
    }
    const ctr = c => { const r = R(c); return [r.left + r.width / 2, r.top]; };
    let ends = [];
    if (u.dataset.up === 'low') {   // anak-anak: menuju garis sambung (bus) baris bawah
      const es = [...t.querySelectorAll(':scope > ul > li')].map(li => ({li, c: li.querySelector(':scope > .cp > .c[data-e], :scope > .fam > .wc.head > .cw > .c[data-e]')})).filter(o => o.c);
      if (!es.length) return;
      const xs = es.map(o => ctr(o.c)[0]);
      ends = es.length === 1 ? [ctr(es[0].c)] : [[Math.min(Math.max(sx, xs[0]), xs[xs.length - 1]), R(es[0].li).top]];
    } else ends = u.dataset.up.split(',').map(k => t.querySelector(`.c[data-ik="${k}"]`)).filter(Boolean).map(ctr);
    ends.forEach(([ex, ey]) => { d += elbow(sx, sy, ex, ey, (sy + ey) / 2); });
  });
  svg.innerHTML = `<path d="${d}"/>${hearts}`;
}

  document.body.classList.add('tv'); zc.hidden = false;

/* ---------- Cetak per cabang ---------- */
async function printDlg() {
  const hasKids = p => D.some(k => k.ayah_id === p.id || k.ibu_id === p.id);
  const roots = D.filter(p => !p.ayah_id && !p.ibu_id && hasKids(p));
  const cand = [...roots, ...D.filter(p => hasKids(p) && !roots.includes(p)).sort((a, b) => a.nama.localeCompare(b.nama))];
  if (!cand.length) return toast('info', 'Belum ada keturunan untuk dicetak');
  const sel = (id, arr) => `<select id="${id}">${arr.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
  const { value: v } = await Swal.fire({
    title: 'Cetak per cabang', width: 520, showCancelButton: true, confirmButtonText: 'Cetak / Simpan PDF', cancelButtonText: 'Batal', focusConfirm: false,
    html: `<div class="f"><div class="w"><label>Mulai dari leluhur</label>${sel('pr', cand.map(p => [p.id, esc(p.nama)]))}</div>
      <div><label>Generasi per halaman</label>${sel('pg', [[2,'2'],[3,'3'],[4,'4'],[5,'5'],[99,'Semua']])}</div>
      <div><label>Ukuran kertas</label>${sel('pp', [['A4','A4'],['A3','A3'],['A5','A5']])}</div>
      <div class="w"><label>Orientasi</label>${sel('po', [['L','Lanskap'],['P','Potret']])}</div></div>
      <p style="font-size:12px;color:#666;text-align:left">Cabang yang tidak muat diberi penanda "lanjut hlm. N" dan dilanjutkan di halaman berikutnya.</p>`,
    didOpen: () => { $('#pg').value = '3'; },
    preConfirm: () => ({root: $('#pr').value, max: +$('#pg').value, paper: $('#pp').value, orient: $('#po').value})
  });
  if (v) doPrint(v);
}

function doPrint({root, max, paper, orient}) {
  const PAPER = {A4: [297, 210], A3: [420, 297], A5: [210, 148]};
  let [w, h] = PAPER[paper]; if (orient === 'P') [w, h] = [h, w];
  const M = 10, mm = 3.7795;
  const availW = (w - 2 * M) * mm, availH = (h - 2 * M) * mm - 60;
  const pages = [{root, from: 0}], out = [];
  for (let i = 0; i < pages.length; i++) {
    const html = node(by(pages[i].root), new Set(), {d: 1, max, cur: i + 1, pages});
    out.push({...pages[i], html});
  }
  const pr = $('#print');
  pr.innerHTML = out.map((pg, i) => `<section class="pg"><div class="pgh"><b>Cabang keluarga ${esc(headOf(unit(by(pg.root))).nama)}</b><span>Halaman ${i + 1} / ${out.length}${pg.from ? ' · sambungan dari hlm. ' + pg.from : ''}</span></div><div class="pgb"><div class="tree"><ul>${pg.html}</ul></div></div></section>`).join('');
  pr.style.setProperty('--pw', availW + 'px');
  pr.classList.add('prep');
  let st = $('#pgst'); if (!st) { st = document.createElement('style'); st.id = 'pgst'; document.head.appendChild(st); }
  st.textContent = `@page{size:${paper} ${orient === 'P' ? 'portrait' : 'landscape'};margin:${M}mm}`;
  alignLines();                                   // ukur garis pada skala 1, baru perkecil
  pr.querySelectorAll('.tree').forEach(t => {
    const sc = Math.min(1, availW / t.offsetWidth, availH / t.offsetHeight);
    if (sc < 1) t.style.zoom = sc;
  });
  setTimeout(() => window.print(), 150);
}
window.addEventListener('afterprint', () => { const pr = $('#print'); pr.classList.remove('prep'); pr.innerHTML = ''; });

/* ---------- Atur urutan ---------- */
function mv(b, d) {
  const li = b.closest('li'), ul = li.parentNode;
  if (d < 0 && li.previousElementSibling) ul.insertBefore(li, li.previousElementSibling);
  else if (d > 0 && li.nextElementSibling) ul.insertBefore(li.nextElementSibling, li);
}
async function orderDlg(id) {
  const p = by(id);
  const sp = split(p.pasangan_id).map(by).filter(Boolean);
  const kd = D.filter(k => k.ayah_id === id || k.ibu_id === id).sort(ord);
  const list = (t, arr, cls) => arr.length < 2 ? '' : `<div style="text-align:left;font-weight:600;margin-top:6px">${t}</div><ul class="ord ${cls}">${arr.map(x => `<li data-id="${x.id}"><span>${esc(x.nama)}</span><span><button type="button" onclick="mv(this,-1)" aria-label="Naik">▲</button><button type="button" onclick="mv(this,1)" aria-label="Turun">▼</button></span></li>`).join('')}</ul>`;
  const g = c => [...document.querySelectorAll('.ord.' + c + ' li')].map(l => l.dataset.id);
  const r = await Swal.fire({title:'Atur urutan', html:list('Urutan pasangan (kiri ke kanan)', sp, 'sp') + list('Urutan anak (kiri ke kanan)', kd, 'kd'), showCancelButton:true, confirmButtonText:'Simpan urutan', cancelButtonText:'Batal',
    preConfirm: () => ({sp: g('sp'), kd: g('kd')})});   // dibaca selagi dialog masih terbuka
  if (!r.isConfirmed || !(await needKey())) return;
  const {sp: s, kd: ks} = r.value, items = [];
  if (s.length) items.push({id, pasangan_id: s.concat(split(p.pasangan_id).filter(x => !s.includes(x))).join(',')});
  ks.forEach((kid, i) => items.push({id: kid, urutan: String(i + 1)}));
  if (!items.length) return;
  busy('Menyimpan urutan…');
  try { await api('bulk', items); await load(true); Swal.close(); toast('success', 'Urutan berhasil disimpan'); }
  catch (e) { Swal.fire('Gagal menyimpan urutan', e.message, 'error'); }
}

/* ---------- Form ---------- */
const opt = (sel, list) => '<option value="">—</option>' + list.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.nama)}</option>`).join('');

async function openForm(p = {}) {
  const others = D.filter(x => x.id !== p.id);
  const { value: v } = await Swal.fire({
    title: p.id ? 'Ubah anggota' : 'Tambah anggota', width: 560, showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal', focusConfirm: false,
    html: `<div class="f">
      <div class="w"><label>Nama lengkap *</label><input id="n" value="${esc(p.nama)}"></div>
      <div><label>Jenis kelamin</label><select id="g"><option value="L" ${p.gender !== 'P' ? 'selected' : ''}>Laki-laki</option><option value="P" ${p.gender === 'P' ? 'selected' : ''}>Perempuan</option></select></div>
      <div><label>Foto (URL gambar)</label><input id="fo" value="${esc(p.foto)}" placeholder="https://…"></div>
      <div><label>Lahir</label><input id="l" value="${esc(p.lahir)}" placeholder="1950 atau 1950-05-17"></div>
      <div><label>Wafat</label><input id="w" value="${esc(p.wafat)}" placeholder="kosongkan jika hidup"></div>
      <div><label>Ayah</label><select id="a">${opt(p.ayah_id, others.filter(x => x.gender === 'L'))}</select></div>
      <div><label>Ibu</label><select id="i">${opt(p.ibu_id, others.filter(x => x.gender === 'P'))}</select></div>
      <div class="w"><label>Pasangan (boleh lebih dari satu)</label><div class="chk">${others.length ? others.map(x => `<label><input type="checkbox" class="sp" value="${x.id}" ${split(p.pasangan_id).includes(x.id) ? 'checked' : ''}> ${esc(x.nama)}</label>`).join('') : '<small>Belum ada anggota lain</small>'}</div></div>
      <div class="w"><label>Catatan</label><textarea id="c" rows="2">${esc(p.catatan)}</textarea></div></div>`,
    preConfirm: () => {
      const g = id => document.getElementById(id).value.trim();
      if (!g('n')) { Swal.showValidationMessage('Nama wajib diisi'); return false; }
      return {nama:g('n'), gender:g('g'), foto:g('fo'), lahir:g('l'), wafat:g('w'), ayah_id:g('a'), ibu_id:g('i'), pasangan_id:[...document.querySelectorAll('.sp:checked')].map(x => x.value).join(','), catatan:g('c')};
    }
  });
  if (!v) return;
  if (!(await needKey())) return;
  if (p.id) v.id = p.id;
  v.urutan = p.urutan || '';
  busy('Menyimpan…');
  try {
    const r = await api(p.id ? 'update' : 'add', v);
    const id = p.id || r.id;
    const nw = split(v.pasangan_id), od = split(p.pasangan_id);   // sinkronkan pasangan dua arah
    for (const sid of nw.filter(x => !od.includes(x))) {
      const s = by(sid); if (!s) continue;
      const l = split(s.pasangan_id);
      if (!l.includes(id)) { l.push(id); await api('update', {...s, pasangan_id: l.join(',')}); }
    }
    for (const sid of od.filter(x => !nw.includes(x))) {
      const s = by(sid); if (!s) continue;
      await api('update', {...s, pasangan_id: split(s.pasangan_id).filter(x => x !== id).join(',')});
    }
    await load(true);
    Swal.close(); toast('success', 'Data berhasil disimpan');
  } catch (e) { Swal.fire('Gagal menyimpan', e.message, 'error'); }
}

async function del(id) {
  const p = by(id);
  const ok = await Swal.fire({title:'Hapus anggota?', text:`"${p.nama}" akan dihapus permanen.`, icon:'warning', showCancelButton:true, confirmButtonColor:'#b91c1c', confirmButtonText:'Ya, hapus', cancelButtonText:'Batal'});
  if (!ok.isConfirmed || !(await needKey())) return;
  busy('Menghapus…');
  try { await api('delete', {id}); await load(true); Swal.close(); toast('success', 'Data berhasil dihapus'); }
  catch (e) { Swal.fire('Gagal menghapus', e.message, 'error'); }
}

if (document.fonts) document.fonts.ready.then(() => relayout());
load();
</script>
